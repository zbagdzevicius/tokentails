<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trailer v3 type</title>
<!-- Dev-only page for tools/trailer/v3/type.mjs (never in the game build). -->
<style>
  @font-face { font-family: 'Fredoka'; src: url('/pkg/public/assets/fonts/Fredoka-Latin.woff2') format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'Fredoka'; src: url('/pkg/public/assets/fonts/Fredoka-Ext.woff2') format('woff2'); font-weight: 300 700; unicode-range: U+0000-024F, U+0300-036F, U+1E00-1EFF; }
  html, body { margin: 0; background: transparent; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { Compositor } from './mg.js';
  window.mgInit = async ({ cut, aspect, copy }) => {
    await document.fonts.load('700 100px Fredoka', 'Pawlegends CATS © ·');
    window.comp = new Compositor(document.getElementById('c'), { cut, aspect, copy });
    return document.fonts.check('700 100px Fredoka');
  };
  window.mgFrame = (f) => {
    window.comp.render(f);
    return document.getElementById('c').toDataURL('image/png');
  };
  window.mgBoxes = (f) => window.comp.boxes(f);
</script>
</body>
</html>
