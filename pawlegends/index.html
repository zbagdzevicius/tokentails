<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2b1d2e" />
    <meta name="robots" content="noindex" />
    <meta name="format-detection" content="telephone=no" />
    <title>Pawlegends</title>
    <!-- the PawLegends app icon (brand/pawlegends: favicon.ico, favicon-32.png, apple-touch-icon-180.png) -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" sizes="180x180" />
    <link rel="preload" href="%BASE_URL%assets/brand/logo-720.webp" as="image" type="image/webp" />
    <meta name="description" content="Pawlegends: 3v3 cats and dogs. Seven-minute matches." />
    <!-- audit GFX-14 / UX-13: the one Fredoka file, fetched with the page (app.ts installFont uses the same URL) -->
    <link rel="preload" href="%BASE_URL%assets/fonts/Fredoka-Ext.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      :root {
        --bg: #2b1d2e; --cream: #fff3dc; --butter: #ffd27a; --peach: #ff9f7a; --rose: #ff6f91;
        --sage: #a8d5a2; --sky: #9fd3ff; --ink: #2a1a22; --danger: #e5484d;
      }
      html, body {
        margin: 0; height: 100%; background: var(--bg); color: var(--cream); overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none;
        -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      }
      #app { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; }
      /* audit UX-13: an inline boot splash (the page was a blank purple screen until the JS ran); app.ts sets
         html[data-ready] when the title is up, and the splash fades out under it */
      #boot {
        position: fixed; inset: 0; z-index: 1; display: grid; place-content: center; justify-items: center; gap: 14px; pointer-events: none;
        background: radial-gradient(circle at 50% 42%, #3d2a42, var(--bg) 70%); transition: opacity 0.35s ease-out, visibility 0s linear 0.35s;
      }
      /* the logo sits dead centre at 240 px, like the native launch screen (pawlegends-app LaunchLogo, 240 pt), so the
         hand-over does not jump; the bar hangs below it */
      #boot img { width: 240px; height: auto; animation: boot-paw 1.1s ease-in-out infinite; }
      #boot i { width: 120px; height: 4px; border-radius: 4px; background: rgba(255, 243, 220, 0.18); overflow: hidden; position: absolute; left: 50%; top: calc(50% + 100px); margin-left: -60px; }
      #boot i::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: inherit; background: var(--rose); animation: boot-bar 1.2s ease-in-out infinite; }
      html[data-ready='1'] #boot, body:has(#crash) #boot { opacity: 0; visibility: hidden; }
      @keyframes boot-paw { 50% { transform: translateY(-4px) scale(1.02); } }
      @keyframes boot-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot img, #boot i::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-hidden="true">
      <img src="%BASE_URL%assets/brand/logo-720.webp" alt="" width="720" height="454" /><i></i>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
