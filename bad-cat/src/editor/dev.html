<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Bad Cat Room Maker dev</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2b1d2e; color: #fff3dc; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      .dev-modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(20, 12, 24, 0.82); }
      .dev-card { background: #3a2740; border-radius: 18px; padding: 16px; width: min(92vw, 360px); text-align: center; }
      .dev-card button { min-height: 44px; min-width: 56px; margin: 4px; border-radius: 12px; border: 0; background: #ffd27a; font: inherit; font-weight: 800; cursor: pointer; }
      .dev-card a { color: #9fd3ff; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
