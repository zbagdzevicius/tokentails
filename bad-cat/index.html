<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#2b1d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Bad Cat Daily</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Bad Cat Daily: be the cat. Knock things off the counter before the human turns around. A new room every day." />
    <meta property="og:title" content="Bad Cat Daily" />
    <meta property="og:description" content="Be a bad cat. A new room every day." />
    <meta property="og:image" content="https://tokentails.com/badcat-game/og/glass.png" />
    <meta property="og:url" content="https://tokentails.com/badcat" />
    <meta name="twitter:image" content="https://tokentails.com/badcat-game/og/glass.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        /* Warm cozy palette. UI lanes extend these in src/ui/styles.css. */
        --bg: #2b1d2e; --cream: #fff3dc; --butter: #ffd27a; --peach: #ff9f7a; --rose: #ff6f91;
        --sage: #a8d5a2; --sky: #9fd3ff; --ink: #2a1a22; --danger: #e5484d;
      }
      html, body {
        margin: 0; height: 100%; background: var(--bg); color: var(--cream); overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; touch-action: none; overscroll-behavior: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
