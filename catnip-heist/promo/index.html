<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catnip Heist Showreel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #000; color: #eee; overflow: hidden; }
  body { font: 12px/1.4 "SF Mono", Menlo, monospace; }
  #c { display: block; width: 1920px; height: 1080px; image-rendering: auto; }
  body.play { height: 100vh; display: flex; align-items: center; justify-content: center; }
  body.play #c { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; cursor: pointer; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px 10px; display: none;
         background: linear-gradient(transparent, rgba(0,0,0,.85)); user-select: none; }
  body.play #hud { display: block; }
  body.play.nohud #hud { display: none; }
  #hud .row { display: flex; gap: 18px; align-items: center; white-space: nowrap; }
  #hud b { color: #9be15d; font-weight: 600; }
  #hud .dim { color: #888; }
  #scrub { width: 100%; margin: 6px 0 0; accent-color: #9be15d; }
  #ticks { position: relative; height: 6px; margin: 0 7px; }
  #ticks i { position: absolute; top: 0; width: 1px; height: 6px; background: #555; }
  #ticks i.bar { background: #ccc; height: 6px; }
  #splash { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            color: #fff; font-size: 16px; pointer-events: none; text-shadow: 0 0 8px #000; }
  body.play.paused #splash { display: flex; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="splash">click / space to play</div>
<div id="hud">
  <div class="row">
    <span><b id="tc">00:00.000</b></span>
    <span>frame <b id="fr">0</b></span>
    <span>bar.beat <b id="bb">1.1</b></span>
    <span>scenes <b id="sc">-</b></span>
    <span class="dim" id="st"></span>
    <span class="dim" style="margin-left:auto">space play/pause · ←/→ frame · shift+←/→ beat · L loop · M mute · H hide HUD</span>
  </div>
  <input id="scrub" type="range" min="0" max="15" step="0.0166667" value="0">
  <div id="ticks"></div>
</div>
<audio id="a" preload="auto" src="assets/audio/track.wav"></audio>
<script type="module" src="engine.js"></script>
</body>
</html>
