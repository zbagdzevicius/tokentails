<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Ultra Cat trailer text cards. render-cards.mjs calls window.show(cards, frame, aspect) per frame and screenshots
     with a transparent background. Every animation is a pure function of the frame, so re-renders are identical. -->
<style>
  @font-face { font-family: 'Nunito'; src: url('fonts/nunito-latin-wght-normal.woff2') format('woff2'); font-weight: 200 1000; }
  @font-face { font-family: 'Passion One'; src: url('fonts/passion-one-latin-900-normal.woff2') format('woff2'); font-weight: 900; }
  :root { --ink: #241a16; --cream: #fff6e6; --orange: #ff8a3d; --gold: #ffd24a; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: 100vw; height: 100vh; position: relative; font-family: 'Nunito', sans-serif; }
  .card { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .slam { position: absolute; left: 50%; top: 50%; text-align: center; white-space: nowrap; }
  .logo { font: 900 var(--logo) / 0.86 'Passion One', sans-serif; color: var(--orange); letter-spacing: 0.01em;
    -webkit-text-stroke: calc(var(--logo) * 0.06) var(--ink); paint-order: stroke fill;
    text-shadow: 0 calc(var(--logo) * 0.07) 0 var(--ink); }
  .logo b { color: var(--cream); font-weight: 900; }
  .sub { margin-top: calc(var(--logo) * 0.12); display: inline-block; font: 900 var(--subf) / 1 'Nunito', sans-serif; color: var(--ink);
    background: var(--cream); border: calc(var(--subf) * 0.14) solid var(--ink); border-radius: 999px; padding: 0.32em 0.8em 0.4em;
    box-shadow: 0 calc(var(--subf) * 0.16) 0 var(--ink); letter-spacing: 0.02em; }
  .cap { position: absolute; left: 50%; white-space: nowrap; text-align: center; }
  .cap .t { display: inline-block; font: 900 var(--capf) / 1 'Nunito', sans-serif; color: var(--cream); text-transform: uppercase;
    letter-spacing: 0.03em; background: var(--ink); border-radius: calc(var(--capf) * 0.35); padding: 0.28em 0.7em 0.36em;
    box-shadow: 0 calc(var(--capf) * 0.14) 0 var(--orange); }
  .cap .t i { font-style: normal; color: var(--orange); }
  .cap .s { display: block; margin: 0.5em auto 0; width: max-content; font: 900 calc(var(--capf) * 0.62) / 1 'Nunito', sans-serif; color: var(--ink);
    background: var(--cream); border-radius: 999px; padding: 0.3em 0.8em 0.38em; text-transform: uppercase; letter-spacing: 0.03em; }
  .tag { position: absolute; white-space: nowrap; }
  .tag .t { display: inline-block; font: 900 var(--tagf) / 1 'Nunito', sans-serif; color: var(--ink); background: var(--c);
    border: calc(var(--tagf) * 0.12) solid var(--ink); border-radius: calc(var(--tagf) * 0.4); padding: 0.26em 0.6em 0.34em;
    box-shadow: 0 calc(var(--tagf) * 0.14) 0 var(--ink); text-transform: uppercase; letter-spacing: 0.02em; }
  .tag .s { display: block; margin-top: 0.3em; font: 900 calc(var(--tagf) * 0.8) / 1 'Nunito', sans-serif; color: var(--cream);
    text-shadow: 0 3px 0 var(--ink), 0 0 10px rgba(0,0,0,.5); letter-spacing: 0.06em; }
  .end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .end .url { margin-top: calc(var(--logo) * 0.18); font: 900 var(--subf) / 1.15 'Nunito', sans-serif; color: var(--cream);
    text-shadow: 0 4px 0 var(--ink); white-space: nowrap; }
  .end .url b { color: var(--gold); font-weight: 900; }
  .end .paw { font: 900 calc(var(--subf) * 0.8) / 1 'Nunito', sans-serif; color: var(--ink); background: var(--orange);
    border: calc(var(--subf) * 0.12) solid var(--ink); border-radius: 999px; padding: 0.35em 0.9em 0.42em; margin-top: calc(var(--logo) * 0.16);
    box-shadow: 0 calc(var(--subf) * 0.14) 0 var(--ink); text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const back = (x) => { x = Math.min(1, Math.max(0, x)); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  window.show = (cards, f, aspect) => {
    const W = innerWidth, H = innerHeight, tall = aspect === '9x16';
    const u = tall ? W / 1080 : W / 1920; // px per output px
    const root = document.getElementById('root');
    let html = '';
    for (const c of cards) {
      const l = f - c.at;
      if (l < 0 || l >= c.len) continue;
      const out = c.len - l; // frames left
      if (c.kind === 'slam') {
        const s = l < 7 ? 2.4 - 1.4 * back(l / 7) : 1 + 0.03 * Math.sin(l * 0.25) * Math.max(0, 1 - l / 40);
        const o = out < 5 ? out / 5 : 1;
        const so = out < 5 ? 1 + (5 - out) * 0.06 : 1;
        const lg = (tall ? 190 : 230) * u;
        html += `<div class="card"><div class="slam" style="--logo:${lg}px;--subf:${(tall ? 52 : 44) * u}px;opacity:${o};transform:translate(-50%,-50%) rotate(-4deg) scale(${s * so})">
          <div class="logo">ULTRA <b>CAT</b></div>${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ''}</div></div>`;
      } else if (c.kind === 'cap') {
        const x = l < 6 ? -60 * (1 - ease(l / 6)) : out < 5 ? 40 * (1 - out / 5) : 0;
        const o = l < 6 ? ease(l / 6) : out < 5 ? out / 5 : 1;
        const top = tall ? 0.2 : 0.8;
        const t = esc(c.text).replace(/(\d+)/g, '<i>$1</i>');
        html += `<div class="card"><div class="cap" style="--capf:${(tall ? 58 : 50) * u}px;top:${top * H}px;opacity:${o};transform:translate(calc(-50% + ${x * u}px),-50%) rotate(-2deg)">
          <span class="t">${t}</span>${c.sub ? `<span class="s">${esc(c.sub)}</span>` : ''}</div></div>`;
      } else if (c.kind === 'tag') {
        const y = l < 6 ? 40 * (1 - back(l / 6)) : 0;
        const o = l < 4 ? l / 4 : out < 4 ? out / 4 : 1;
        const pos = tall ? `left:${70 * u}px;top:${0.62 * H}px` : `left:${70 * u}px;top:${0.6 * H}px`;
        html += `<div class="card"><div class="tag" style="--tagf:${(tall ? 50 : 44) * u}px;--c:${c.color ?? '#ff8a3d'};${pos};opacity:${o};transform:translateY(${y * u}px) rotate(-3deg)">
          <span class="t">${esc(c.text)}</span>${c.sub ? `<span class="s">${esc(c.sub)}</span>` : ''}</div></div>`;
      } else if (c.kind === 'end') {
        const s = l < 9 ? 2.0 - 1.0 * back(l / 9) : 1 + 0.015 * Math.sin((l - 9) * 0.13);
        const o2 = ease((l - 12) / 10);
        const o3 = ease((l - 22) / 10);
        const lg = (tall ? 200 : 210) * u;
        const url = esc(c.sub).replace('tokentails.com/ultra-cat', '<b>tokentails.com/ultra-cat</b>');
        html += `<div class="card"><div class="end" style="--logo:${lg}px;--subf:${(tall ? 66 : 54) * u}px">
          <div class="logo" style="transform:rotate(-4deg) scale(${s})">ULTRA <b>CAT</b></div>
          <div class="url" style="opacity:${o2};transform:translateY(${(1 - o2) * 30 * u}px)">${tall ? url.replace(' at ', ' at<br>') : url}</div>
          <div class="paw" style="opacity:${o3};transform:scale(${0.8 + 0.2 * o3})">Giant cat. Tiny city.</div></div></div>`;
      }
    }
    root.innerHTML = html;
    return html.length > 0;
  };
  window.__ready = document.fonts.ready.then(() => true);
</script>
</body>
</html>
