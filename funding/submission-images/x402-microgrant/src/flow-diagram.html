<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../_shared/brand.css">
<!-- Sequence diagram of the x402 `exact` flow in backend/src/shelter/onchain/x402-exact.ts. 1600x900. -->
<style>
  body { background: radial-gradient(90% 80% at 50% 0%, #1e1633 0%, #0b0820 60%, #07051a 100%); position: relative; }
  svg { position: absolute; inset: 0; }
  .hd { position: absolute; left: 70px; top: 38px; display: flex; align-items: center; gap: 22px; }
  .hd h1 { font-size: 52px; }
  .hd img { height: 64px; }
  .hd .tt-chip { font-size: 18px; }
  text { font-family: Nunito; fill: var(--cream); }
  .lane { font-family: "Passion One"; font-weight: 700; font-size: 28px; text-transform: uppercase; letter-spacing: .03em; }
  .lsub { font-size: 17px; fill: var(--muted); font-weight: 600; }
  .lbl { font-size: 21px; font-weight: 700; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 19px; }
  .num { font-family: "Passion One"; font-weight: 700; font-size: 20px; fill: var(--gold-ink); }
  .note { font-size: 17px; fill: var(--muted); font-weight: 600; }
  .foot { position: absolute; left: 70px; right: 70px; bottom: 28px; display: flex; gap: 18px; align-items: center; font-size: 19px; font-weight: 600; }
  .foot b { color: var(--gold-400); }
  .foot .tt-chip { font-size: 16px; flex: none; }
</style>
</head>
<body>
<div class="hd">
  <img src="../../_shared/assets/logo-text.webp" alt="">
  <h1 class="tt-title">How an agent pays <span class="tt-glow">a shelter</span> over x402</h1>
  <span class="tt-chip">Standard x402 · exact scheme</span>
</div>
<svg width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7aa2"/></marker>
  </defs>
  <!-- lanes: x = 230, 630, 1030, 1400 -->
  <g>
    <rect x="95" y="138" width="270" height="78" rx="16" fill="#120d1f" stroke="#90c5e9" stroke-width="3"/>
    <text class="lane" x="230" y="174" text-anchor="middle" fill="#90c5e9">AI agent</text>
    <text class="lsub" x="230" y="200" text-anchor="middle">has a small USDC budget</text>
    <rect x="495" y="138" width="270" height="78" rx="16" fill="#120d1f" stroke="#e2c05a" stroke-width="3"/>
    <text class="lane" x="630" y="174" text-anchor="middle" fill="#ffcc55">Token Tails API</text>
    <text class="lsub" x="630" y="200" text-anchor="middle">sells shelter cat cards</text>
    <rect x="895" y="138" width="270" height="78" rx="16" fill="#120d1f" stroke="#9a88c9" stroke-width="3"/>
    <text class="lane" x="1030" y="174" text-anchor="middle" fill="#f0c5fd">Facilitator</text>
    <text class="lsub" x="1030" y="200" text-anchor="middle">verifies, settles, pays gas</text>
    <rect x="1265" y="138" width="270" height="78" rx="16" fill="#2a1022" stroke="#ff7aa2" stroke-width="3"/>
    <text class="lane" x="1400" y="174" text-anchor="middle" fill="#ff7aa2">Shelter wallet</text>
    <text class="lsub" x="1400" y="200" text-anchor="middle">the shelter's own key</text>
  </g>
  <g stroke="#3a2d5c" stroke-width="3" stroke-dasharray="8 9">
    <line x1="230" y1="218" x2="230" y2="805"/><line x1="630" y1="218" x2="630" y2="805"/>
    <line x1="1030" y1="218" x2="1030" y2="805"/><line x1="1400" y1="218" x2="1400" y2="805"/>
  </g>

  <!-- 1 -->
  <g><line x1="236" y1="285" x2="622" y2="285" stroke="#90c5e9" stroke-width="4" marker-end="url(#a)"/>
    <circle cx="200" cy="285" r="16" fill="#ffcc55"/><text class="num" x="200" y="292" text-anchor="middle">1</text>
    <text class="mono" x="262" y="270" fill="#90c5e9">GET /shelter/agent/cat-card</text></g>
  <!-- 2 -->
  <g><line x1="624" y1="355" x2="238" y2="355" stroke="#ff7aa2" stroke-width="4" marker-end="url(#a)"/>
    <circle cx="660" cy="355" r="16" fill="#ffcc55"/><text class="num" x="660" y="362" text-anchor="middle">2</text>
    <text class="lbl" x="262" y="340" fill="#ff7aa2">402 Payment Required</text>
    <text class="note" x="690" y="350">accepts: scheme exact · asset USDC</text>
    <text class="note" x="690" y="372">payTo = the shelter's wallet, not ours</text></g>
  <!-- 3 -->
  <g><rect x="95" y="400" width="505" height="62" rx="12" fill="#1e1633" stroke="#ffcc55" stroke-width="2"/>
    <circle cx="124" cy="431" r="16" fill="#ffcc55"/><text class="num" x="124" y="438" text-anchor="middle">3</text>
    <text class="lbl" x="152" y="438" fill="#ffcc55">Signs one EIP-3009 transfer <tspan fill="#fcecbb">to the shelter</tspan></text></g>
  <!-- 4 -->
  <g><line x1="236" y1="515" x2="622" y2="515" stroke="#ffcc55" stroke-width="4" marker-end="url(#a)"/>
    <circle cx="200" cy="515" r="16" fill="#ffcc55"/><text class="num" x="200" y="522" text-anchor="middle">4</text>
    <text class="mono" x="262" y="500" fill="#ffcc55">retry + X-PAYMENT header</text></g>
  <!-- 5 -->
  <g><line x1="636" y1="585" x2="1022" y2="585" stroke="#f0c5fd" stroke-width="4" marker-end="url(#a)"/>
    <circle cx="600" cy="585" r="16" fill="#ffcc55"/><text class="num" x="600" y="592" text-anchor="middle">5</text>
    <text class="lbl" x="662" y="570" fill="#f0c5fd">/verify, then /settle</text></g>
  <!-- 6 -->
  <g><line x1="1036" y1="655" x2="1392" y2="655" stroke="#ff7aa2" stroke-width="6" marker-end="url(#b)"/>
    <circle cx="1000" cy="655" r="16" fill="#ffcc55"/><text class="num" x="1000" y="662" text-anchor="middle">6</text>
    <text class="lbl" x="1062" y="638" fill="#ff7aa2">USDC: agent → shelter</text>
    <text class="note" x="1062" y="684">one public transfer on-chain;</text>
    <text class="note" x="1062" y="706">the facilitator pays the gas</text></g>
  <!-- 7 -->
  <g><line x1="624" y1="745" x2="238" y2="745" stroke="#7fd66b" stroke-width="4" marker-end="url(#a)"/>
    <circle cx="660" cy="745" r="16" fill="#ffcc55"/><text class="num" x="660" y="752" text-anchor="middle">7</text>
    <text class="lbl" x="262" y="730" fill="#7fd66b">200 OK · the cat card</text>
    <text class="note" x="690" y="740">after the API reads the settled</text>
    <text class="note" x="690" y="762">transfer back from the chain</text>
    <text class="mono" x="262" y="785" fill="#9a88c9" font-size="17">{ name, imageUrl, shelterName }</text></g>
</svg>
<div class="foot">
  <span class="tt-chip pink">Custody</span>
  <span>Token Tails <b>never holds, relays or signs for</b> the money. On mainnet the scheme is offered only once the shelter holds its own wallet key.</span>
</div>
</body>
</html>
