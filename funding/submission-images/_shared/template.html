<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<!--
  Brand banner template. render.mjs --spec x.json injects window.SPEC. Open it directly in a browser
  with ?demo to preview the defaults. Spec fields (all optional except w/h):
    w, h            pixel size
    layout          "split" (text left, art right) | "center" | "art" (art fills, text on a scrim) | "stack" (text top, art bottom)
    bg              "none" (transparent, render with --transparent) | "dusk" | "night" | "space" | "sky" | "clouds" | "payouts" | "temple" | "temple-cat" | any image path (relative to the spec file)
    dim             0..1 darkening over the background (default .45)
    logo            "text" (TOKEN TAILS wordmark with cat) | "word" (wordmark only) | "cat" | "none"
    kicker          small chip above the title
    title           HTML allowed; wrap the glowing part in <em>...</em>
    subtitle        one or two short lines
    chips           [{ "text": "...", "tone": "gold|mint|pink" }]
    art             image path (screenshot, still); artFit "cover"|"contain"; artPos CSS object-position
    art2            optional second image (phone screenshot) overlapping the first in split layout
    footer          small line at the bottom (e.g. "tokentails.com")
    scale           multiply all type (default 1)
    textWidth       split layout: share of width for the text column (default .46)
-->
<style>
  body { background: var(--night-900); position: relative; }
  #bg, #scrim { position: absolute; inset: 0; }
  #bg { background-size: cover; background-position: center; }
  #scrim { background: radial-gradient(120% 90% at 30% 40%, rgba(11,8,32,var(--dimA)) 0%, rgba(11,8,32,var(--dimB)) 100%); }
  .dusk { background: linear-gradient(180deg, var(--dusk-top) 0%, var(--dusk-mid) 62%, var(--dusk-horizon) 100%); }
  #stage { position: absolute; inset: 0; display: flex; padding: calc(var(--u) * 4.2) calc(var(--u) * 4.4) calc(var(--u) * var(--padB, 4.2)); gap: calc(var(--u) * 3.5); }
  .col { display: flex; flex-direction: column; justify-content: center; gap: calc(var(--t) * 1.4); min-width: 0; }
  #logo img { display: block; }
  #kicker { font-size: calc(var(--t) * 1.5); align-self: flex-start; }
  #title { font-size: calc(var(--t) * 5.6); }
  #title em { font-style: normal; }
  #subtitle { font-size: calc(var(--t) * 2.05); line-height: 1.32; font-weight: 600; color: var(--cream); max-width: 30em; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #chips { display: flex; flex-wrap: wrap; gap: calc(var(--t) * .8); font-size: calc(var(--t) * 1.35); }
  #footer { position: absolute; left: calc(var(--u) * 4.4); bottom: calc(var(--u) * 2.4); font-family: "Passion One"; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; font-size: calc(var(--u) * 1.45); color: var(--gold-400); text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  #artwrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
  #art { width: 100%; height: 100%; }
  #art img { width: 100%; height: 100%; display: block; }
  #art2 { position: absolute; right: -2%; bottom: -3%; height: 78%; aspect-ratio: 390/844; border-radius: calc(var(--u) * 2.2); border-width: 4px; }
  #art2 img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  /* layouts */
  .center #stage { flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .center .col { align-items: center; }
  .center #kicker { align-self: center; }
  .center #chips { justify-content: center; }
  .center #footer { left: 0; right: 0; text-align: center; }
  .art #stage { align-items: flex-end; }
  .art #art-full { position: absolute; inset: 0; }
  .art #art-full img { width: 100%; height: 100%; object-fit: cover; }
  .art #scrim { background: linear-gradient(0deg, rgba(7,5,26,.94) 0%, rgba(7,5,26,.7) 34%, rgba(7,5,26,0) 62%); }
  .stack #stage { flex-direction: column; }
  .stack .col { flex: 0 0 auto; }
</style>
</head>
<body>
<div id="bg"></div><div id="scrim"></div>
<div id="stage"></div>
<div id="footer"></div>
<script>
(function () {
  const demo = { w: 1200, h: 630, layout: "split", bg: "temple", logo: "text", kicker: "Demo",
    title: "Play cat games.<br><em>Fund real shelters.</em>", subtitle: "Token Tails", chips: [{ text: "tokentails.com" }],
    art: "screens/live-landing-1440.png", footer: "" };
  const S = Object.assign({ layout: "split", bg: "temple", dim: .45, logo: "text", scale: 1, artFit: "cover", artPos: "top", textWidth: .46 }, window.SPEC || demo);
  const shared = S.shared || "./";
  const base = S.base || shared;
  const res = (p) => !p ? "" : /^(https?:|file:|data:|\/)/.test(p) ? (p.startsWith("/") ? "file://" + p : p) : new URL(p, base).href;
  const BG = { temple: ["assets/hero-grounds.webp", "assets/hero-bg.webp"], "temple-cat": "assets/hero-cat-with-ground.webp", space: "assets/card-bg.webp",
               night: "", dusk: "", sky: "assets/hero-bg.webp", payouts: "assets/payouts-hero.webp", clouds: "assets/game-bg.webp" };
  const w = S.w, h = S.h;
  const u = Math.min(w, h * 1.9) / 100 * S.scale;
  document.documentElement.style.setProperty("--u", u + "px");
  document.documentElement.style.setProperty("--t", u + "px");
  if (S.footer) document.documentElement.style.setProperty("--padB", 6.4);
  document.documentElement.style.setProperty("--dimA", S.dim * 0.75);
  document.documentElement.style.setProperty("--dimB", Math.min(1, S.dim * 1.35));
  document.body.className = S.layout;
  const bg = document.getElementById("bg");
  if (S.bg === "none") { document.body.style.background = "transparent"; document.getElementById("scrim").style.display = "none"; }
  else if (S.bg === "dusk") bg.classList.add("dusk");
  else if (S.bg in BG) { if (BG[S.bg]) bg.style.backgroundImage = [].concat(BG[S.bg]).map((p) => `url("${new URL(p, shared).href}")`).join(", "); }
  else bg.style.backgroundImage = `url("${res(S.bg)}")`;
  if (S.bgPos) bg.style.backgroundPosition = S.bgPos;

  const stage = document.getElementById("stage");
  const col = document.createElement("div"); col.className = "col";
  const el = (tag, id, cls, html) => { const e = document.createElement(tag); if (id) e.id = id; if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  if (S.logo && S.logo !== "none") {
    const L = el("div", "logo"); const img = document.createElement("img");
    const src = { text: "assets/logo-text.webp", word: "assets/logo-pure-text.webp", cat: "assets/cat-logo-1024.png" }[S.logo];
    img.src = new URL(src, shared).href;
    const lh = S.logoH || { text: 11, word: 5.5, cat: 12 }[S.logo];
    img.style.height = `calc(var(--t) * ${lh})`; if (S.logo === "cat") img.className = "tt-pixel";
    L.appendChild(img); col.appendChild(L);
  }
  if (S.kicker) col.appendChild(el("div", "kicker", "tt-chip", S.kicker));
  if (S.title) { const t = el("div", "title", "tt-title", S.title); t.querySelectorAll("em").forEach((e) => e.classList.add("tt-glow")); if (S.titleSize) t.style.fontSize = `calc(var(--t) * ${S.titleSize})`; col.appendChild(t); }
  if (S.subtitle) { const s = el("div", "subtitle", null, S.subtitle); if (S.subtitleSize) s.style.fontSize = `calc(var(--t) * ${S.subtitleSize})`; col.appendChild(s); }
  if (S.chips && S.chips.length) { const c = el("div", "chips"); S.chips.forEach((x) => c.appendChild(el("span", null, "tt-chip " + (x.tone && x.tone !== "gold" ? x.tone : ""), x.text))); col.appendChild(c); }

  if (S.layout === "art" && S.art) {
    const full = el("div", "art-full"); const img = document.createElement("img"); img.src = res(S.art);
    img.style.objectPosition = S.artPos || "center"; full.appendChild(img); document.body.insertBefore(full, bg.nextSibling);
    document.body.insertBefore(document.getElementById("scrim"), full.nextSibling);
    stage.appendChild(col);
  } else {
    stage.appendChild(col);
    if (S.art && S.layout !== "center") {
      const wrap = el("div", "artwrap"); const a = el("div", "art", "tt-panel"); const img = document.createElement("img");
      img.src = res(S.art); img.style.objectFit = S.artFit; img.style.objectPosition = S.artPos; a.appendChild(img); wrap.appendChild(a);
      if (S.artAspect) { a.style.width = "auto"; a.style.height = "auto"; a.style.maxWidth = "100%"; a.style.maxHeight = "100%"; a.style.aspectRatio = S.artAspect; a.style.width = "100%"; }
      if (S.art2) { const b = el("div", "art2", "tt-panel"); const i2 = document.createElement("img"); i2.src = res(S.art2); b.appendChild(i2); wrap.appendChild(b); }
      stage.appendChild(wrap);
      if (S.layout === "split") col.style.flex = `0 0 ${S.textWidth * 100}%`;
    }
  }
  document.getElementById("footer").innerHTML = S.footer || "";
  // shrink text until the column fits the stage (fonts must be loaded first)
  document.fonts.ready.then(() => {
    const imgs = [...document.images].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }));
    return Promise.all(imgs);
  }).then(() => {
    const st = getComputedStyle(stage);
    const avail = () => stage.clientHeight - parseFloat(st.paddingTop) - parseFloat(st.paddingBottom);
    const need = () => { const kids = [...col.children]; const gap = parseFloat(getComputedStyle(col).rowGap) || 0;
      return kids.reduce((a, k) => a + k.getBoundingClientRect().height, 0) + gap * Math.max(0, kids.length - 1); };
    const wide = () => [...col.querySelectorAll("#title,#subtitle,#chips,#kicker")].some((e) => e.scrollWidth > col.clientWidth + 1);
    let t = u, n = 0;
    while ((need() > avail() || wide()) && n++ < 40) { t *= 0.95; document.documentElement.style.setProperty("--t", t + "px"); }
    window.__fit = { u, t, n }; window.__ready = true;
  });
  if (S.css) { const st = document.createElement("style"); st.textContent = S.css; document.head.appendChild(st); }
})();
</script>
</body>
</html>
