# Builds catnip-heist/ and deploys it to GitHub Pages.
# - With `domain` set (e.g. catnip.tokentails.com) the game is served at the domain root and a CNAME
#   file is published. DNS: a CNAME record `catnip` -> `<owner>.github.io`; then set the same custom
#   domain under Settings > Pages and tick "Enforce HTTPS".
# - With `domain` empty it is served at /<repo>/heist/ (e.g. /tokentails/heist/).
# Manual only: run it from the Actions tab. It never runs on push.
# One-time setup by a maintainer: Settings > Pages > Source: "GitHub Actions".
name: Catnip Heist to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Custom domain served at its root (empty = /<repo>/heist/)
        required: false
        default: catnip.tokentails.com
      payouts_url:
        description: Shelter payouts page linked from the win screen
        required: false
        default: https://tokentails.com/shelter-payouts

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catnip-heist-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catnip-heist
    env:
      HEIST_DOMAIN: ${{ inputs.domain }}
      HEIST_BASE: ${{ inputs.domain != '' && '/' || format('/{0}/heist/', github.event.repository.name) }}
      HEIST_PAYOUTS_URL: ${{ inputs.payouts_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catnip-heist/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Stage the site
        run: |
          if [ -n "$HEIST_DOMAIN" ]; then
            mkdir -p ../_site
            cp -R dist/. ../_site/
            printf '%s\n' "$HEIST_DOMAIN" > ../_site/CNAME
          else
            mkdir -p ../_site/heist
            cp -R dist/. ../_site/heist/
          fi
          touch ../_site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
