# Paw Legends web game: cache warm-up after a deploy (LATENCY-PLAN C5, infra/gcp/RUNBOOK.md "Latency").
# A push to main that changes the committed embed build (pawlegends `npm run build:client` writes
# pawlegends-web/public/pawlegends-game) waits until pawlegends.app (pawlegends-web's own Vercel project,
# docs/plans/moba/PAWLEGENDS-WEB.md) serves the new index.html, then fetches every build/ file the push added once.
# pawlegends.app is not in the CF_ZONE_ID zone, so there is no Cloudflare purge (--no-purge). tokentails.com only
# redirects the game paths there. The warm-up fills Vercel's cache and the edge nearest the runner (GitHub-hosted
# runners are in the US). The OTA manifests (still on tokentails.com) are purged by pawlegends-ota.yml.
name: Pawlegends CDN

on:
  push:
    branches: [main]
    paths:
      - 'pawlegends-web/public/pawlegends-game/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pawlegends-cdn
  cancel-in-progress: false

jobs:
  warm:
    name: warm new build files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SINCE: ${{ github.event.before || 'HEAD~1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Warm (pawlegends.app)
        run: |
          # a force push or the first push has no usable `before`: fall back to the previous commit
          if ! git cat-file -e "$SINCE^{commit}" 2>/dev/null; then SINCE=HEAD~1; fi
          node scripts/cdn-cache.mjs game --since "$SINCE" --no-purge
