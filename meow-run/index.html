<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#8fd3ff" />
    <title>Meow Run</title>
    <meta name="description" content="Meow Run: Mochi the kitten races home across the countryside before dinner." />
    <!-- META-UI lane owns this file (markup + CSS). Ids read by src/ui/*.ts; the smoke test uses #play, .stage[data-id], #pauseBtn, #pause*, #res*. -->
    <style>
      :root {
        --ink: #2a1c14; --ink2: #4a3326; --cream: #fff7ea; --paper: #fff1d6; --orange: #ff8a2a; --orange2: #ffb03a; --gold: #ffc21a; --gold2: #ffe066;
        --rose: #ff4f7b; --sky: #4cc3ff; --grass: #7ccf5a; --navy: #24324a;
        --font: ui-rounded, 'SF Pro Rounded', 'Nunito', 'Arial Rounded MT Bold', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
        --o2: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 1.5px 1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink);
        --o3: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 2.2px 2.2px 0 var(--ink), -2.2px -2.2px 0 var(--ink), 2.2px -2.2px 0 var(--ink), -2.2px 2.2px 0 var(--ink);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; color: var(--cream); font-family: var(--font);
        -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; }
      button { font-family: inherit; color: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
      h1, h2, h3, p { margin: 0; }
      kbd { display: inline-block; min-width: 1.7em; text-align: center; padding: 1px 8px; border-radius: 7px; background: var(--cream); color: var(--ink); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 900 .85em/1.35 var(--font); text-shadow: none; }
      .txt { font-weight: 900; text-shadow: var(--o2), 0 4px 0 var(--ink); }
      .hidden { display: none !important; }
      .ico { width: 1em; height: 1em; vertical-align: -.14em; }
      .ico.star.on { fill: var(--gold); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
      .ico.star.off { fill: rgba(42,28,20,.18); stroke: rgba(42,28,20,.45); stroke-width: 1.4; stroke-linejoin: round; }
      body.touch .kb, body:not(.touch) .tc { display: none !important; }

      /* ------------------------------------------------------------------ screens */
      .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: calc(16px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl)); }
      body[data-screen="title"] #title, body[data-screen="select"] #select, body[data-screen="pause"] #pause, body[data-screen="settings"] #settings,
      body[data-screen="results"] #results, body[data-screen="cutscene"] #cutscene { display: flex; }
      body:not([data-screen="play"]) .hud { display: none; }
      .dim { background: radial-gradient(ellipse at 50% 45%, rgba(42,28,20,.15), rgba(42,28,20,.55)); }
      .card { position: relative; background: var(--cream); color: var(--ink); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink), 0 18px 40px rgba(0,0,0,.25);
        padding: 22px 24px; width: min(460px, 100%); text-align: center; animation: cardIn .32s cubic-bezier(.2,1.4,.4,1) both; }
      .card h2 { font-size: 30px; font-weight: 900; letter-spacing: .01em; }
      @keyframes cardIn { from { transform: translateY(30px) scale(.9); opacity: 0; } }
      .btn { position: relative; border: 3.5px solid var(--ink); border-radius: 18px; background: linear-gradient(#ffa040, var(--orange)); color: var(--cream); font-weight: 900; font-size: 20px; letter-spacing: .04em;
        padding: 10px 26px; box-shadow: 0 6px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.35); min-height: 52px; text-shadow: 0 2px 0 rgba(42,28,20,.55); transition: transform .08s; }
      .btn:hover { transform: translateY(-2px); }
      .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.35); }
      .btn.alt { background: linear-gradient(#fffdf6, #f3e3c6); color: var(--ink); text-shadow: none; }
      .btn.green { background: linear-gradient(#9be06e, #5fb93c); }
      .btn.big { font-size: 30px; padding: 12px 54px; min-height: 66px; border-radius: 22px; }
      .iconbtn { width: 52px; height: 52px; padding: 0; display: grid; place-items: center; border: 3.5px solid var(--ink); border-radius: 16px; background: var(--cream); color: var(--ink); box-shadow: 0 5px 0 var(--ink); }
      .iconbtn svg { width: 26px; height: 26px; }
      .iconbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
      .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

      /* ------------------------------------------------------------------ title */
      #title { justify-content: space-between; background: linear-gradient(rgba(255,255,255,0) 55%, rgba(42,28,20,.28)); }
      #title .top { display: flex; width: 100%; justify-content: flex-end; }
      #title .mid { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: -4vh; }
      #logo { position: relative; display: flex; flex-direction: column; align-items: center; line-height: .86; transform: rotate(-4deg); }
      #logo .w { display: flex; }
      #logo span { display: inline-block; font-weight: 900; font-size: clamp(64px, 15vw, 150px); color: var(--gold); letter-spacing: -.01em;
        text-shadow: 5px 0 0 var(--ink), -5px 0 0 var(--ink), 0 5px 0 var(--ink), 0 -5px 0 var(--ink), 3.6px 3.6px 0 var(--ink), -3.6px -3.6px 0 var(--ink), 3.6px -3.6px 0 var(--ink), -3.6px 3.6px 0 var(--ink), 0 12px 0 var(--ink), 0 22px 30px rgba(0,0,0,.25);
        animation: letter 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * .09s); }
      #logo .w2 span { color: var(--orange2); font-size: clamp(76px, 18vw, 178px); }
      @keyframes letter { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-10px) rotate(-3deg); } 90% { transform: translateY(2px); } }
      #titleMascot { position: absolute; right: -12%; top: -34%; width: clamp(78px, 15vw, 132px); aspect-ratio: 1; transform: rotate(10deg); animation: mascot 3s ease-in-out infinite; }
      #titleMascot canvas { width: 100% !important; height: 100% !important; border-radius: 50%; filter: drop-shadow(0 6px 0 var(--ink)); }
      @keyframes mascot { 50% { transform: rotate(4deg) translateY(-8px); } }
      /* a soft plate keeps the subtitle readable over the attract runner */
      #title .tag { font-size: clamp(18px, 3vw, 24px); margin-top: 26px; padding: 4px 18px; border-radius: 999px; background: radial-gradient(ellipse at center, rgba(42,28,20,.42), rgba(42,28,20,.18) 70%, rgba(42,28,20,0)); }
      #title .bot { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 4vh; }
      #title .hint { font-size: 15px; font-weight: 800; opacity: .95; animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .45; } }
      #titleStars { font-size: 18px; }

      /* ------------------------------------------------------------------ stage select */
      #select { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; background: linear-gradient(rgba(36,50,74,.25), rgba(42,28,20,.45)); }
      #select header { display: flex; align-items: center; gap: 14px; width: min(1080px, 100%); }
      #select header h2 { flex: 1; font-size: clamp(26px, 4vw, 40px); }
      #select header .tot { font-size: 20px; }
      #mapWrap { position: relative; width: min(1080px, 100%); margin: auto 0; }
      #trail { position: absolute; left: 6%; right: 6%; top: 38%; height: 0; border-top: 6px dashed rgba(255,247,234,.85); filter: drop-shadow(0 3px 0 rgba(42,28,20,.5)); }
      #stageList { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
      .stage { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; border: 4px solid var(--ink); border-radius: 22px; background: var(--cream); color: var(--ink);
        padding: 10px 10px 14px; box-shadow: 0 7px 0 var(--ink), 0 16px 30px rgba(0,0,0,.2); transition: transform .12s; animation: cardIn .4s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(var(--i) * .07s); }
      .stage:nth-child(2) { transform: translateY(18px) rotate(.8deg); } .stage:nth-child(1) { transform: rotate(-1deg); } .stage:nth-child(3) { transform: rotate(-.6deg); }
      .stage:not(.locked):hover { transform: translateY(-6px) rotate(0); }
      .stage .thumb { position: relative; width: 100%; aspect-ratio: 16/10; border-radius: 14px; border: 3px solid var(--ink); overflow: hidden; background: #8fd3ff; }
      .stage .thumb canvas { width: 100%; height: 100%; }
      .stage .num { position: absolute; left: -14px; top: -14px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--orange); color: var(--cream);
        border: 4px solid var(--ink); font-weight: 900; font-size: 22px; text-shadow: 0 2px 0 var(--ink); z-index: 2; }
      .stage b { font-size: 21px; font-weight: 900; padding: 2px 4px 0; }
      .stage .blurb { font-size: 14px; font-weight: 700; color: var(--ink2); padding: 0 4px; min-height: 2.5em; }
      .stage .meta { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; font-weight: 900; font-size: 15px; }
      .stage .stars { font-size: 26px; letter-spacing: -2px; }
      .stage.locked { cursor: default; background: #e8dccb; }
      .stage.locked .thumb canvas { filter: grayscale(.85) brightness(.75); }
      .stage .lock { position: absolute; inset: 0; display: grid; place-items: center; }
      .stage .lock svg { width: 54px; height: 54px; filter: drop-shadow(0 4px 0 var(--ink)); }
      .stage.endless { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 16px; padding: 10px 18px 10px 10px; margin-top: 18px; background: linear-gradient(90deg, #fff7ea, #ffe9c4); transform: none !important; }
      .stage.endless .thumb { width: 150px; flex: none; aspect-ratio: 16/10; }
      .stage.endless .info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .stage.endless .best { text-align: right; font-weight: 900; font-size: 15px; line-height: 1.25; }
      .stage.endless .best big { display: block; font-size: 26px; }
      .stage.fresh::after { content: 'NEW!'; position: absolute; right: -10px; top: -14px; background: var(--rose); color: var(--cream); border: 3px solid var(--ink); border-radius: 12px; padding: 2px 10px; font-weight: 900; font-size: 15px; transform: rotate(8deg); box-shadow: 0 3px 0 var(--ink); animation: wob 1s ease-in-out infinite; }
      @keyframes wob { 50% { transform: rotate(-4deg) scale(1.08); } }

      /* ------------------------------------------------------------------ pause / settings */
      #pause .card .sub { display: flex; justify-content: center; gap: 18px; margin: 8px 0 16px; font-weight: 900; font-size: 18px; color: var(--ink2); }
      #pause .col { display: flex; flex-direction: column; gap: 12px; align-items: stretch; width: min(280px, 100%); margin: 0 auto; }
      #pauseCat { width: 86px; height: 86px; margin: -64px auto 6px; border-radius: 50%; overflow: hidden; border: 4px solid var(--ink); background: var(--cream); box-shadow: 0 5px 0 var(--ink); }
      #settings .card { text-align: left; }
      #settings h2 { text-align: center; margin-bottom: 12px; }
      .set { display: grid; grid-template-columns: 110px 1fr 42px; align-items: center; gap: 10px; padding: 8px 2px; min-height: 44px; font-weight: 900; font-size: 17px; border-bottom: 2px dashed rgba(42,28,20,.15); }
      .set output { text-align: right; font-size: 15px; color: var(--ink2); }
      input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 9px; border: 3px solid var(--ink); background: linear-gradient(90deg, var(--orange) var(--v, 50%), #f1e2c8 var(--v, 50%)); touch-action: pan-x; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--cream); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
      input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: var(--cream); border: 3px solid var(--ink); }
      .seg { grid-column: 2 / 4; display: flex; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 3px 0 var(--ink); }
      .seg button { flex: 1; border: 0; background: var(--cream); color: var(--ink); font-weight: 900; font-size: 15px; padding: 8px 4px; min-height: 44px; }
      .seg button + button { border-left: 3px solid var(--ink); }
      .seg button.on { background: var(--gold); }
      .tog { grid-column: 2 / 4; justify-self: start; width: 64px; height: 34px; border-radius: 20px; border: 3px solid var(--ink); background: #e6d6bd; position: relative; box-shadow: 0 3px 0 var(--ink); }
      .tog::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--cream); border: 3px solid var(--ink); transition: left .15s; }
      .tog.on { background: var(--grass); } .tog.on::after { left: 30px; }
      /* a 44 px tap target around the 34 px switch */
      .tog::before { content: ''; position: absolute; inset: -8px -6px; }
      #settings .row { margin-top: 16px; }
      #settings .note { font-size: 13px; font-weight: 700; color: var(--ink2); margin-top: 10px; text-align: center; }

      /* ------------------------------------------------------------------ results */
      #results { background: radial-gradient(ellipse at 50% 40%, rgba(255,194,26,.18), rgba(42,28,20,.5)); }
      #results .card { width: min(540px, 100%); padding-top: 64px; }
      #resCat { position: absolute; left: 50%; top: -58px; width: 110px; height: 110px; transform: translateX(-50%) rotate(-4deg); border-radius: 22px; overflow: hidden; border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); }
      #resTitle { font-size: 34px; }
      #resStage { font-weight: 800; color: var(--ink2); font-size: 15px; margin-top: 2px; }
      #resStars { display: flex; justify-content: center; gap: 8px; margin: 12px 0 2px; }
      #resStars .sl { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 900; color: var(--ink2); width: 92px; }
      #resStars .ico { font-size: 62px; }
      #resStars .sl:nth-child(2) .ico { font-size: 78px; margin-top: -12px; }
      #resStars .sl .ico.on { animation: starPop .5s cubic-bezier(.2,1.8,.4,1) both; animation-delay: calc(.35s + var(--i) * .35s); }
      @keyframes starPop { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
      #resScore { font-size: 54px; font-weight: 900; line-height: 1.05; color: var(--orange); text-shadow: var(--o3), 0 5px 0 var(--ink); margin: 6px 0 2px; }
      #resBest { display: inline-block; background: var(--rose); color: var(--cream); font-weight: 900; padding: 3px 14px; border-radius: 12px; border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); transform: rotate(-3deg); animation: wob 1s ease-in-out infinite; }
      #resChips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 12px 0 4px; }
      .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; font-weight: 900; font-size: 15px; }
      .chip svg { width: 20px; height: 20px; }
      #resUnlock { margin-top: 10px; background: var(--grass); color: var(--cream); font-weight: 900; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; text-shadow: 0 2px 0 var(--ink); box-shadow: 0 3px 0 var(--ink); }
      #resBells { display: none; }

      /* ------------------------------------------------------------------ cutscene */
      #cutscene { justify-content: space-between; padding: 0; pointer-events: auto; }
      #cutscene .bar { width: 100%; height: 11vh; background: #120c08; }
      #cutCaption { position: absolute; left: 0; right: 0; bottom: 16vh; text-align: center; font-size: clamp(30px, 6vw, 58px); color: var(--gold); text-shadow: var(--o3), 0 6px 0 var(--ink); opacity: 0; transition: opacity .5s, transform .5s; transform: translateY(16px) rotate(-2deg); }
      #cutCaption.on { opacity: 1; transform: none; }
      #cutSkip { position: absolute; right: calc(18px + var(--sr)); bottom: calc(3vh + var(--sb)); font-weight: 900; font-size: 15px; opacity: .8; color: var(--cream); background: none; border: 0; }
      #fade { position: fixed; inset: 0; background: #120c08; opacity: 0; pointer-events: none; transition: opacity .45s; z-index: 5; }
      #fade.on { opacity: 1; }

      /* ------------------------------------------------------------------ HUD */
      .hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
      .hud .tl { position: absolute; left: calc(14px + var(--sl)); top: calc(12px + var(--st)); display: flex; gap: 12px; align-items: flex-start; }
      #pauseBtn { pointer-events: auto; width: 54px; height: 54px; border-radius: 15px; border: 3.5px solid var(--ink); background: linear-gradient(#fffdf6, #f1e2c6); box-shadow: 0 5px 0 var(--ink); display: grid; place-items: center; }
      #pauseBtn svg { width: 22px; height: 22px; }
      #pauseBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
      .stats { display: flex; flex-direction: column; gap: 5px; padding-top: 1px; }
      #hearts { display: flex; gap: 3px; }
      .heart { width: 30px; height: 28px; transition: transform .2s; }
      .heart .f { fill: #ff2f4f; } .heart .hl { fill: #fff; opacity: .7; }
      .heart.off .f { fill: rgba(42,28,20,.35); } .heart.off .hl { opacity: 0; }
      .heart.lost { animation: heartLost .6s ease-out; }
      @keyframes heartLost { 0% { transform: scale(1.6) rotate(-12deg); } 30% { transform: scale(.7) rotate(10deg) translateY(6px); } 100% { transform: none; } }
      body.lastlife .heart:not(.off) { animation: beat .7s ease-in-out infinite; }
      @keyframes beat { 30% { transform: scale(1.18); } }
      #bells { display: flex; gap: 2px; align-items: center; }
      .bell { width: 25px; height: 25px; }
      .bell .slot { fill: rgba(42,28,20,.22); stroke: rgba(255,247,234,.7); stroke-width: 1.6; stroke-dasharray: 3 2.2; }
      .bell .b { fill: rgba(255,247,234,.35); }
      .bell.on .slot { fill: #ffd84d; stroke: var(--ink); stroke-width: 2; stroke-dasharray: none; }
      .bell.on .b { fill: #ff9a1c; }
      .bell.got { animation: bellGot .7s cubic-bezier(.2,1.8,.4,1); }
      @keyframes bellGot { 0% { transform: scale(2.4) rotate(-30deg); } 100% { transform: none; } }
      #bellCount { margin-left: 5px; font-weight: 900; font-size: 17px; font-style: italic; text-shadow: var(--o2), 0 3px 0 var(--ink); }
      #portrait { position: absolute; left: calc(14px + var(--sl)); top: calc(84px + var(--st)); width: 92px; height: 92px; opacity: 0; transform: scale(.4) rotate(-8deg); transform-origin: 20% 20%; }
      #portrait canvas { width: 100%; height: 100%; border-radius: 6px; box-shadow: 0 5px 0 var(--ink); }
      #portrait.show { animation: portraitIn 1.6s ease-out forwards; }
      @keyframes portraitIn { 0% { opacity: 0; transform: scale(.4) rotate(-14deg); } 12% { opacity: 1; transform: scale(1.12) rotate(-3deg); } 22% { transform: scale(1) rotate(-4deg); } 82% { opacity: 1; transform: scale(1) rotate(-4deg); } 100% { opacity: 0; transform: scale(.9) rotate(-4deg); } }
      #prog { position: absolute; left: 50%; top: calc(24px + var(--st)); transform: translateX(-50%); width: min(42vw, 560px); height: 14px; border: 3px solid var(--ink); border-radius: 9px; background: var(--navy); box-shadow: 0 3px 0 rgba(42,28,20,.6); }
      #progFill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#ffe680, var(--gold) 60%, #f0a400); border-radius: 6px; }
      #progTicks i { position: absolute; top: -1px; bottom: -1px; width: 3px; margin-left: -1.5px; background: rgba(255,247,234,.6); border-radius: 2px; }
      #progTicks i.past { background: var(--ink); opacity: .5; }
      #progTicks i.flash { animation: tick .8s ease-out; }
      @keyframes tick { 0% { transform: scaleY(3); background: #fff; } }
      #progKnob { position: absolute; top: 50%; width: 30px; height: 30px; transform: translate(-50%, -54%); }
      #progHome { position: absolute; right: -40px; top: -11px; width: 30px; height: 30px; filter: drop-shadow(0 2px 0 var(--ink)); }
      #distPill { position: absolute; left: 50%; top: calc(14px + var(--st)); transform: translateX(-50%); padding: 4px 16px; border-radius: 16px; border: 3px solid var(--ink); background: var(--navy); font-weight: 900; font-size: 22px; box-shadow: 0 3px 0 rgba(42,28,20,.6); }
      #distPill small { font-size: 14px; color: var(--gold); margin-left: 8px; }
      body.endless #prog, body.endless #bells, body.nobells #bells { display: none; }
      body:not(.endless) #distPill { display: none; }
      .hud .tr { position: absolute; right: calc(18px + var(--sr)); top: calc(8px + var(--st)); text-align: right; }
      #score { font-size: 46px; line-height: 1; font-weight: 900; font-style: italic; letter-spacing: -.01em; text-shadow: var(--o3), 0 5px 0 var(--ink); transform-origin: 100% 50%; }
      #score.bump { animation: bump .25s ease-out; }
      @keyframes bump { 40% { transform: scale(1.12); } }
      /* the score multiplier: smaller than the score and labelled, so it never reads like the combo meter */
      #mult::before { content: 'MULT '; font-size: .58em; letter-spacing: .06em; color: var(--cream); }
      #mult { display: inline-block; margin-top: 2px; font-size: 22px; font-weight: 900; font-style: italic; color: var(--gold); text-shadow: var(--o3), 0 4px 0 var(--ink); transform-origin: 100% 50%; }
      #mult.bump { animation: multBump .35s cubic-bezier(.2,1.8,.4,1); }
      @keyframes multBump { 0% { transform: scale(1.7); color: #fff; } }
      #mult.hot { color: #ff8a2a; }

        <label class="set">Sounds <input type="range" min="0" max="100" data-k="sfx" /><output></output></label>
        <label class="set">Shake <input type="range" min="0" max="100" data-k="shake" /><output></output></label>
        <div class="set">Quality <div class="seg" id="setQuality"><button data-q="auto">AUTO</button><button data-q="low">LOW</button><button data-q="high">HIGH</button></div></div>
        <div class="set">Calm mode <button class="tog" id="setReduced" aria-label="Reduced motion"></button></div>
        <p class="note">Calm mode turns off screen shake, FOV kicks and bouncy menus.</p>
        <div class="row"><button id="settingsDone" class="btn">DONE</button></div>
      </div>
    </section>

    <section id="cutscene" class="screen ui">
      <div class="bar"></div>
      <div id="cutCaption">Home for dinner!</div>
      <button id="cutSkip"><span class="kb">Press SPACE to skip</span><span class="tc">Tap to skip</span></button>
      <div class="bar"></div>
    </section>

    <section id="results" class="screen ui">
      <div class="card">
        <div id="resCat"></div>
        <h2 id="resTitle">Stage clear!</h2>
        <div id="resStage"></div>
        <div id="resStars"></div>
        <div id="resScore">0</div>
        <div id="resBest" class="hidden">NEW BEST!</div>
        <div id="resChips"></div>
        <div id="resBells"></div>
        <div id="resUnlock" class="hidden"></div>
        <div id="ugc-results" class="ugc-row"></div>
        <div class="row" style="margin-top: 16px">
          <button id="resRetry" class="btn alt">RETRY</button>
          <button id="resNext" class="btn green">NEXT</button>
          <button id="resMenu" class="btn alt">STAGES</button>
        </div>
      </div>
    </section>
    <div id="fade"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
