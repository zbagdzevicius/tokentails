    <style>:root{--rave-display:"Lilita One";--rave-bg:#020a05;--rave-green:#5dff8a;--rave-green-dim:#1f7a3c;--rave-pink:#ff5fa8;--rave-violet:#a26bff;--rave-ink:#eafff0;--rave-ink-dim:#eafff0b8;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px)}html,body{background:var(--rave-bg);height:100%;color:var(--rave-ink);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}#stage{touch-action:none;outline:none;width:100vw;height:100dvh;display:block;position:fixed;inset:0}#hud{pointer-events:none;padding:calc(12px + var(--safe-top)) calc(16px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(16px + var(--safe-left));box-sizing:border-box;position:fixed;inset:0}#boot{z-index:20;background:radial-gradient(ellipse at 50% 38%, #0b3a1a 0%, #041509 45%, var(--rave-bg) 75%);color:var(--rave-green);--boot-progress:.05;place-items:center;transition:opacity .6s,visibility .6s;display:grid;position:fixed;inset:0}#boot.boot-done{opacity:0;visibility:hidden}.boot-inner{text-align:center;justify-items:center;gap:18px;padding:0 16px;display:grid}.boot-moon{aspect-ratio:1;background:radial-gradient(circle at 34% 30%,#ffffff8c,#0000 22%),radial-gradient(circle at 62% 58%,#1e783c59 0 9%,#0000 10%),radial-gradient(circle at 38% 66%,#1e783c4d 0 6%,#0000 7%),radial-gradient(circle at 70% 30%,#1e783c40 0 5%,#0000 6%),radial-gradient(circle,#d8ffe0 0%,#9dffb4 45%,#3dff6e 100%);border-radius:50%;width:min(46vw,200px);animation:1.765s ease-in-out infinite boot-moon;box-shadow:0 0 40px #3dff6e,0 0 120px #3dff6e8c,0 0 240px #3dff6e40}@keyframes boot-moon{0%,to{transform:scale(1)}8%{transform:scale(1.035)}}.boot-title{font-family:var(--rave-display), system-ui, sans-serif;color:#eafff0;text-shadow:0 0 14px var(--rave-green), 0 0 34px #3dff6e99;letter-spacing:.02em;font-size:clamp(30px,9vw,46px)}.boot-sub{color:#ffd1e6;text-shadow:0 0 10px #ff4f9eb3;margin-top:-10px;font-size:14px;font-weight:700}.boot-bar{background:#5dff8a26;border-radius:99px;width:min(64vw,240px);height:6px;overflow:hidden}.boot-bar:after{content:"";height:100%;width:calc(var(--boot-progress) * 100%);border-radius:inherit;background:linear-gradient(90deg, var(--rave-green), var(--rave-pink));box-shadow:0 0 12px var(--rave-pink);transition:width .4s;display:block}#boot-step{letter-spacing:.14em;text-transform:uppercase;color:var(--rave-ink-dim);font-size:12px}.boot-fallback .boot-card{text-align:center;max-width:420px;color:var(--rave-ink);padding:0 16px}.boot-fallback .boot-moon{width:140px;margin:0 auto 18px}.boot-fallback h1{font-family:var(--rave-display), system-ui, sans-serif;color:#eafff0;text-shadow:0 0 14px var(--rave-green);font-weight:400}.boot-fallback a{color:var(--rave-pink);font-weight:800}@media (prefers-reduced-motion:reduce){.boot-moon{animation:none}}</style>
