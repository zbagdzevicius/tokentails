# DEPRECATED (plan F12, decision #59): replaced by .github/workflows/cdn-sync.yml, which syncs the
# same ./public/ to s3://tokentails-nfts/w/ with Cache-Control headers and never deletes files.
# Do not add jobs here. Removing this file and disabling the GitLab pipeline is a settings change
# done by a maintainer once the GitHub repository secrets DO_SPACES_KEY and DO_SPACES_SECRET exist.
# GitLab does not run from the GitHub remote. If this job is ever re-enabled, run the cdn-sync
# workflow with `reheader` afterwards: files it uploads get no Cache-Control, and the GitHub sync
# skips them while their content is unchanged.
stages:
  - upload

variables:
  SPACE_NAME: "tokentails-nfts"
  SPACE_ENDPOINT: "fra1.digitaloceanspaces.com"

before_script:
  - apt-get update && apt-get install -y s3cmd
  - |
    cat > ~/.s3cfg <<EOF
    [default]
    access_key = $DO_SPACES_KEY
    secret_key = $DO_SPACES_SECRET
    host_base = $SPACE_ENDPOINT
    host_bucket = %(bucket)s.$SPACE_ENDPOINT
    signature_v2 = False
    use_https = True
    EOF

upload_to_do_spaces:
  stage: upload
  script:
    - echo "Uploading files to Digital Ocean Space..."
    - ls -la .
    - s3cmd sync --acl-public ./public/ s3://$SPACE_NAME/w/
  only:
    - main
